# Template only. Keep the filled file and private key outside this repository.
# Bind to the chosen local interface; bracket an IPv6 address before :port.
listen: "REPLACE_WITH_LOCAL_BIND_ADDRESS:REPLACE_WITH_INTERNAL_UDP_PORT"
tls:
  cert: /absolute/path/outside/repository/fullchain.pem
  key: /absolute/path/outside/repository/private-key.pem
auth:
  type: password
  password: REPLACE_WITH_NEW_RANDOM_PASSWORD
# Internet egress only: proxy credentials must not grant access to the home LAN.
# Also deny this home's actual public IP / global IPv6 prefix in the private config.
acl:
  inline:
    - reject(0.0.0.0/8)
    - reject(10.0.0.0/8)
    - reject(100.64.0.0/10)
    - reject(127.0.0.0/8)
    - reject(169.254.0.0/16)
    - reject(172.16.0.0/12)
    - reject(192.168.0.0/16)
    - reject(198.18.0.0/15)
    - reject(224.0.0.0/4)
    - reject(240.0.0.0/4)
    - reject(::/128)
    - reject(::1/128)
    - reject(fc00::/7)
    - reject(fe80::/10)
    - reject(ff00::/8)
    - direct(all)
